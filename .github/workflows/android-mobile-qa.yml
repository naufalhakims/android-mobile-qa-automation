name: Android Mobile QA Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android regression suite
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # The emulator action runs this block with /usr/bin/sh (POSIX shell).
            set -eu
            mkdir -p target
            appium_pid=""
            cleanup() {
              if [ -n "$appium_pid" ]; then
                kill "$appium_pid" 2>/dev/null || true
              fi
            }
            trap cleanup 0
            npm install --global --prefix "$RUNNER_TEMP/appium" appium@3.8.0
            export PATH="$RUNNER_TEMP/appium/bin:$PATH"
            appium driver install uiautomator2
            adb install apps/Android-MyDemoAppRN.1.0.0.build-130.apk
            appium --base-path / --log target/appium.log > target/appium-server.log 2>&1 &
            appium_pid=$!
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4723/status; then
                break
              fi
              sleep 2
            done
            curl --fail --silent http://127.0.0.1:4723/status
            mvn --batch-mode --no-transfer-progress test

      - name: Upload test reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-qa-reports
          path: |
            target/surefire-reports/
            target/failure-artifacts/
            target/appium.log
            target/appium-server.log
          if-no-files-found: warn
          retention-days: 14
